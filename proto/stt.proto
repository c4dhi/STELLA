syntax = "proto3";

package stt;

// Speech-to-Text gRPC Service
// Provides real-time streaming transcription using Sherpa-ONNX
service SpeechToText {
  // Bidirectional streaming: audio chunks in, transcript events out
  rpc StreamTranscribe(stream AudioChunk) returns (stream TranscriptEvent);

  // Health check endpoint
  rpc HealthCheck(Empty) returns (HealthResponse);

  // Warmup the STT model to eliminate cold-start latency
  rpc Warmup(WarmupRequest) returns (WarmupResponse);

  // One-shot: re-decode a specific utterance's own audio, forced to a
  // language the agent has already locked (#57). Used only for a turn whose
  // free decode in StreamTranscribe was doubtful -- too short, or below the
  // keep-text confidence bar. Never a second call on a confident turn, and
  // its result is never fed back into StreamTranscribe's language detection
  // -- only the original free decode is ever evidence (the self-confirming-
  // pin bug this guards against: see LanguageResolver.needs_redecode).
  rpc Redecode(RedecodeRequest) returns (RedecodeResponse);
}

message Empty {}

message HealthResponse {
  bool healthy = 1;
  string model_status = 2;
  string version = 3;
}

message WarmupRequest {
  string session_id = 1;     // Optional, for logging
  int32 duration_ms = 2;     // Dummy audio duration (default: 1000ms)
}

message WarmupResponse {
  bool success = 1;
  int32 warmup_time_ms = 2;  // Time taken for warmup
  string provider = 3;       // "whisper" or "sherpa"
  string message = 4;        // Status or error message
}

message RedecodeRequest {
  bytes audio_data = 1;      // The SAME utterance's raw PCM (16-bit, mono)
  string session_id = 2;     // Logging only
  string language = 3;       // Forced ISO 639-1 language (the resolver's lock)
  int32 sample_rate = 4;     // Sample rate of audio_data (default: 16000)
}

message RedecodeResponse {
  string text = 1;           // "" when the provider cannot force-redecode
                              // (e.g. a lightweight dev provider with no
                              // language steering) -- caller keeps the
                              // original free-decode text in that case.
}

// Audio data sent from client to STT service
message AudioChunk {
  bytes audio_data = 1;        // Raw PCM audio (16-bit, 16kHz, mono)
  string session_id = 2;       // Session identifier for logging
  string participant_id = 3;   // Who is speaking (for transcript attribution)
  int64 timestamp_ms = 4;      // Client timestamp for latency tracking
  int32 sample_rate = 5;       // Sample rate of audio (default: 16000)
  string language = 6;         // Optional ISO 639-1 language hint from the agent
                               // (the resolved/locked language). Stabilizes
                               // transcription; detection stays independent.
}

// Transcript events sent from STT service to client
message TranscriptEvent {
  string text = 1;             // Transcribed text
  bool is_final = 2;           // True if this is the final transcript for an utterance
  string transcript_id = 3;    // Unique ID for this transcript sequence
  string participant_id = 4;   // Who was speaking
  float confidence = 5;        // Confidence score (0.0-1.0)
  int64 timestamp_ms = 6;      // Server timestamp
  bool speech_started = 7;     // VAD detected speech start (for barge-in)
  string detected_language = 8;    // ISO 639-1 language detected for this utterance
                                   // (independent probe, final events only)
  float language_confidence = 9;   // Detection confidence (0.0-1.0); 0 when absent
  string decode_diagnostics = 10;  // JSON blob of decode confidence + comparison
                                   // metrics for a final event. Empty unless
                                   // STT_DECODE_DIAGNOSTICS is on. Carried as
                                   // JSON, not typed fields, because which
                                   // metrics matter is exactly what the
                                   // investigation is still deciding — the
                                   // schema would churn every iteration.
  bool speech_confirmed = 11;      // VAD has now heard enough CONTINUOUS speech
                                   // that this utterance is an interruption
                                   // rather than a backchannel ("mhm"). Emitted
                                   // once per utterance, from VAD alone — no
                                   // decode, no text, no language. This is the
                                   // barge-in trigger: acting on it costs the
                                   // threshold, not a transcription round trip.
  bool speech_ended = 12;          // VAD has stopped hearing speech (entering
                                   // MAYBE_ENDING). Pairs with speech_started
                                   // to bracket "the user is talking right
                                   // now", which is what the agent ducks its
                                   // own voice against. Not the end of the
                                   // utterance — speech may resume inside the
                                   // continuation window, and speech_started
                                   // is re-emitted if it does.

  // End-of-speech timing, on a final only (#92). Logging: nothing acts on
  // these. Unset (not 0) on every other event and from a service that does
  // not measure them, so "absent" and "zero" stay distinguishable.
  optional int32 trailing_silence_ms = 13;  // Silence the turn machine waited
                                            // through before ending the turn
                                            // (silence threshold + window).
  optional int32 decode_ms = 14;            // From ending the turn to this
                                            // final being ready (decode,
                                            // including any wait for a
                                            // partial still running).
  optional int32 speech_ms = 15;            // First speech to the start of
                                            // the closing silence.
  repeated RescuedPause rescued_pauses = 16;  // Pauses inside this utterance
                                              // that entered MAYBE_ENDING but
                                              // were broken by speech inside
                                              // the continuation window.
}

// A pause that nearly ended the turn (#92). Its silence passed the threshold,
// so the turn machine started waiting for the window to run out, and the
// user spoke again before it did.
message RescuedPause {
  int32 pause_ms = 1;                // Length of the silence
  int32 into_window_ms = 2;          // How far into the continuation window
                                     // the user came back
  int32 silence_threshold_ms = 3;    // The thresholds it was measured against
  int32 continuation_window_ms = 4;
}
