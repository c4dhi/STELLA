# Dependabot configuration.
#
# Security updates (driven by the alerts on the default branch) work without
# this file. Version updates do NOT — they only run for the ecosystems and
# directories declared here. The previous version of this file was the
# unmodified GitHub starter template with `package-ecosystem: ""`, which
# matches nothing, so scheduled version updates never ran for any manifest.
#
# Everything below is grouped so a quiet week produces a handful of PRs rather
# than one per package. Majors stay ungrouped and arrive as individual PRs,
# since those need a human to look at them.
#
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ---------------------------------------------------------------- npm ----
  - package-ecosystem: "npm"
    target-branch: "development"
    directories:
      - "/" # NestJS backend
      - "/frontend-ui" # React SPA
      - "/docs-site" # Docusaurus site
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------------------------------------------------------------- pip ----
  - package-ecosystem: "pip"
    target-branch: "development"
    directories:
      - "/message-recorder-python"
      - "/stt-service"
      - "/tts-service"
      - "/agents/stella-v2-agent"
      - "/agents/stella-ai-agent-sdk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # numpy 2.5 raised its floor to Python >=3.12. stt-service's GPU image is
      # nvidia/cuda on ubuntu22.04 with python3.11, so `numpy>=2.5.1` made
      # `pip install -r requirements.txt` fail outright — and stayed invisible
      # until the next rebuild weeks later. requirements.txt carries the
      # matching <2.5 bound. Lift both together with the interpreter.
      - dependency-name: "numpy"
        versions:
          - ">=2.5"
    groups:
      pip-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      pip-security:
        applies-to: security-updates
        patterns:
          - "*"

  # ---------------------------------------------------- github-actions ----
  - package-ecosystem: "github-actions"
    target-branch: "development"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"

  # ------------------------------------------------------------- docker ----
  # Base-image updates for the services we build and ship.
  - package-ecosystem: "docker"
    target-branch: "development"
    directories:
      - "/"
      - "/frontend-ui"
      - "/message-recorder-python"
      - "/stt-service"
      - "/tts-service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    ignore:
      # NOT SAFELY BUMPABLE. The CUDA version must be supported by the GPU
      # node's *driver*. A bump to 13.3.1 merged 2026-07-30 made every GPU pod
      # fail in the NVIDIA prestart hook ("unsatisfied condition: cuda>=13.3"),
      # and surfaced only on the next rebuild, 2026-08-25, as an outage.
      # Bump this only together with the node driver, and only after actually
      # starting the image on a GPU host. See stt-service/Dockerfile.
      - dependency-name: "nvidia/cuda"
    groups:
      docker-base-images:
        patterns:
          - "*"
