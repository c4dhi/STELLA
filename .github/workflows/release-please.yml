name: Release Please

# Keeps a release PR open against main. Merging it bumps package.json,
# CITATION.cff and the README badge, writes CHANGELOG.md, and creates the
# v<version> tag and GitHub Release.
#
# Only main is wired up for now. development would need its own manifest and
# an always-bump-patch config, plus a sync back from main after each release,
# or the two branches hold different versions in the same files and every
# promotion conflicts on them.
# PARKED. The automatic push trigger is disabled on purpose.
#
# release-please works -- it computes the bump, updates the version files,
# writes the changelog and pushes its branch. The only thing it cannot do is
# open the pull request:
#
#   release-please failed: GitHub Actions is not permitted to create or
#   approve pull requests
#
# That is an organisation-level policy on c4dhi. The control is greyed out at
# repository level, so no repo admin can change it.
#
# Left running on every push to main it would fail every time, and a workflow
# that is always red teaches people to ignore red. So it only runs on demand
# until the blocker is resolved. See the tracking issue.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'c4dhi/STELLA'
    # GitHub-hosted: this only touches the repo, never a server, and hosted
    # runners are free for public repositories.
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
