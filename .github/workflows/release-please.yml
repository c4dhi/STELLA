name: Release Please

# Keeps a release PR open against main. Merging it bumps package.json,
# CITATION.cff and the README badge, writes CHANGELOG.md, and creates the
# v<version> tag and GitHub Release.
#
# Only main is wired up for now. development would need its own manifest and
# an always-bump-patch config, plus a sync back from main after each release,
# or the two branches hold different versions in the same files and every
# promotion conflicts on them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.repository == 'c4dhi/STELLA'
    # GitHub-hosted: this only touches the repo, never a server, and hosted
    # runners are free for public repositories.
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # The org policy on c4dhi blocks "Allow GitHub Actions to create and
          # approve pull requests", and it is greyed out at repository level,
          # so GITHUB_TOKEN cannot open the release PR:
          #
          #   release-please failed: GitHub Actions is not permitted to create
          #   or approve pull requests
          #
          # release-please still does everything else with the default token --
          # it computes the bump and pushes its branch -- and only the final
          # "open a PR" call is refused. RELEASE_PLEASE_TOKEN, a fine-grained
          # PAT with Contents and Pull requests read/write, lets it finish.
          #
          # Falls back to the default token when the secret is absent, so the
          # workflow still runs (and still fails at the PR step) rather than
          # breaking outright.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
