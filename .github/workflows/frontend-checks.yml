name: Frontend checks

# The web interface had no checks: a change that did not compile or broke a
# test was found only when the development server built it after the merge.
#
# Lint is not run here: ESLint 10 ignores frontend-ui/.eslintrc.json, and
# typescript-eslint does not support the frontend's TypeScript 7 yet. `tsc -b`
# in the build type-checks. See https://github.com/c4dhi/STELLA/issues/661.
on:
  push:
    branches: [main, development]
    paths:
      - 'frontend-ui/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'frontend-ui/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check and bundle)
        run: npm run build

      - name: Unit tests
        run: npm run test:ci
