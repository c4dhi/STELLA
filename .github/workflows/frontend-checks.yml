name: Frontend checks

# The web interface had no checks: a change that did not compile or broke a
# test was found only when the development server built it after the merge.
#
# Lint is oxlint (frontend-ui/.oxlintrc.json), not ESLint, because
# typescript-eslint does not support the frontend's TypeScript 7 yet; switch
# back once it does (https://github.com/c4dhi/STELLA/issues/719). Errors fail
# the job; warnings are older findings still to be cleared.
on:
  push:
    branches: [main, development]
    paths:
      - 'frontend-ui/**'
      - '.github/workflows/frontend-checks.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'frontend-ui/**'
      - '.github/workflows/frontend-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check and bundle)
        run: npm run build

      - name: Unit tests
        run: npm run test:ci
