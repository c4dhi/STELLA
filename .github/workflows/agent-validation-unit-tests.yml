name: Agent Validation Unit Tests

on:
  push:
    branches: [main, development]
    paths:
      - 'src/agent-package/**'
      - 'agents/*/agent.yaml'
      - 'agents/*/config/experts/**'
      - 'prisma/schema.prisma'
      - 'prisma/seed.ts'
      - 'docs-site/static/schemas/**'
      - 'src/kubernetes/utils/**'
      - 'src/common/utils/**'
      - 'src/agents/deployable-agent-type.*'
      - 'src/agents/agent-requirements.*'
      - 'src/agents/deploy-request.*'
      - 'src/agents/default-agent-type.*'
      - 'src/agents/no-agent-slugs.spec.ts'
      - 'src/agent-type/**'
      - 'agents/stella-ai-agent-sdk/pyproject.toml'
      - 'src/agent-upload/**'
      - 'src/agent-build/**'
      - 'src/agent-image/**'
      - 'src/platform-settings/**'
      - 'src/mcp/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-validation-unit-tests.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'src/agent-package/**'
      - 'agents/*/agent.yaml'
      - 'agents/*/config/experts/**'
      - 'prisma/schema.prisma'
      - 'prisma/seed.ts'
      - 'docs-site/static/schemas/**'
      - 'src/kubernetes/utils/**'
      - 'src/common/utils/**'
      - 'src/agents/deployable-agent-type.*'
      - 'src/agents/agent-requirements.*'
      - 'src/agents/deploy-request.*'
      - 'src/agents/default-agent-type.*'
      - 'src/agents/no-agent-slugs.spec.ts'
      - 'src/agent-type/**'
      - 'agents/stella-ai-agent-sdk/pyproject.toml'
      - 'src/agent-upload/**'
      - 'src/agent-build/**'
      - 'src/agent-image/**'
      - 'src/platform-settings/**'
      - 'src/mcp/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/agent-validation-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The deploy, upload and platform-settings specs import @prisma/client,
      # which needs the generated client (no database involved).
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run issue-specific validation unit tests
        run: |
          npm test -- --runTestsByPath \
            src/agent-package/validators/manifest.validator.spec.ts \
            src/agent-package/manifest-contract.spec.ts \
            src/agent-package/schemas/stella-light-manifest.spec.ts \
            src/kubernetes/utils/agent-config-injection.util.spec.ts \
            src/common/utils/sanitize-config.spec.ts \
            src/kubernetes/utils/resource-clamping.util.spec.ts \
            src/agents/deployable-agent-type.spec.ts \
            src/agents/agent-requirements.spec.ts \
            src/agent-package/sdk-support.spec.ts \
            src/agents/deploy-request.spec.ts \
            src/agents/no-agent-slugs.spec.ts \
            src/agents/plan-resolution.spec.ts \
            src/agent-type/deprecation.spec.ts \
            src/agent-upload/agent-upload.controller.spec.ts \
            src/agent-upload/agent-admin.guard.spec.ts \
            src/agent-build/agent-build.safety.spec.ts \
            src/agent-image/agent-image.service.spec.ts \
            src/platform-settings/agent-review.spec.ts \
            src/platform-settings/platform-settings.spec.ts \
            src/mcp/mcp.spec.ts
