name: Publish SDK to PyPI

# Publishes agents/stella-ai-agent-sdk when an sdk-v* tag is pushed.
#
# Uses PyPI Trusted Publishing (OIDC): no API token, no repository secret,
# nothing to rotate. PyPI verifies the workflow identity directly. This needs
# a one-time trusted publisher configured on PyPI -- see the PR description.
#
# sdk-v* deliberately does not collide with the release-tags ruleset, which
# matches refs/tags/v* and governs platform releases.
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for Trusted Publishing

jobs:
  publish:
    if: github.repository == 'c4dhi/STELLA'
    # GitHub-hosted on purpose: this only builds a pure-Python wheel and talks
    # to PyPI. It must never run on a self-hosted runner.
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the SDK
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist agents/stella-ai-agent-sdk

      - name: Check the artifacts before uploading
        # PyPI rejects malformed metadata, and a rejected upload still burns
        # the version number. Fail here instead.
        run: |
          python -m twine check dist/*
          ls -la dist

      - name: Verify the tag matches the package version
        # An sdk-v0.5.1 tag publishing 0.5.0 would be silently wrong, and
        # unfixable afterwards since PyPI versions are immutable.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('agents/stella-ai-agent-sdk/pyproject.toml','rb'))['project']['version'])")
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $PKG_VERSION"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
