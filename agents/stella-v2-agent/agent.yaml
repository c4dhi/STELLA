version: "1.0"

metadata:
  name: "STELLA V2"
  slug: "stella-v2-agent"
  version: "1.1.0"
  description: "Streamlined 3-stage pipeline: Expert Pool (self-gating), Deterministic Arbitration, Response Generator."
  icon: "🧠"
  tags:
    - voice
    - ai
    - expert-consultation
    - v2

capabilities:
  - voice
  - text
  - plans
  - experts
  # Free-flow mode that can load, run and drop plans mid-conversation. Gates the
  # companion_router the same way `plans` gates task_extraction: both are
  # mechanisms a mode is MADE of, not assessment experts an operator opts into.
  - companion

image:
  dockerfile: "Dockerfile"

resources:
  memory:
    request: "512Mi"
    limit: "2Gi"
  cpu:
    request: "500m"
    limit: "2000m"

configSchema:
  type: object
  x-stella-supports-configurator: true
  properties:
    plan:
      type: object
      description: "Plan configuration with states, tasks, and deliverables"
      x-stella-requires-plan: true
    experts_dir:
      type: string
      description: "Path to external experts config directory (overrides built-in)"
    expert_overrides:
      type: object
      description: "Per-expert runtime overrides (e.g., {\"medical\": {\"enabled\": false}})"
    llm:
      type: object
      description: "LLM configuration (model, temperature, etc.)"
      properties:
        model:
          type: string
          default: "gpt-4o-mini"
        temperature:
          type: number
          default: 0.7
  x-stella-env-vars:
    - OPENAI_API_KEY
  x-stella-optional-env-vars:
    - name: INTERRUPT_MODE
      description: "Transcript interrupt behavior: 'none' (turn-based gating, default) or 'smart' (barge-in with re-prompting)"
      default: "none"
    - name: BARGE_IN_ENABLED
      description: "Operator override for barge-in. This agent supports barge-in by default; set 'false' to force it off, 'true' to force on. Leave unset to follow the agent's declaration."
    - name: TTS_ENABLED
      description: "Enable text-to-speech audio output. Set to 'false' for text-only mode."
      default: "true"
    - name: STELLA_TELEPROMPTER_ENABLED
      description: "Live teleprompter (#241): stream the reply dimmed and light each word as it is spoken. ON BY DEFAULT — set 'false' to disable. Leave unset to keep it on."
    - name: TRANSCRIPT_DEBOUNCE_MS
      description: "Debounce window (ms) for aggregating rapid successive final transcripts. 0 to disable."
      default: "300"
    - name: STELLA_EXPERTS_DIR
      description: "External directory for expert JSON configs (overrides built-in)"
    - name: EXPERT_TIMEOUT_MS
      description: "Timeout per expert in milliseconds"
      default: "3000"
    - name: STELLA_LANGUAGE
      description: "Pin the conversation to one language (ISO 639-1, e.g. 'de'): STT transcribes as it, the resolver forces every turn to it, and the reply is written in it — so a short or garbled first utterance still gets answered in that language. Empty or 'auto' = detect per turn and fall back to the default language."
    - name: TTS_LANGUAGE
      description: "Seed language for TTS (ISO 639-1, e.g. 'de'). Empty = follow the per-turn detected language; the agent overrides this each turn."
    - name: TTS_VOICE
      description: "Seed TTS voice, overridable per stream. Honored by voice-selecting providers (e.g. Kokoro), ignored by others. Empty = provider default."
    - name: STELLA_TTS_PREROLL_MS
      description: "Fix the jitter buffer (ms) of audio held before each sentence plays. Leave unset (recommended): the agent measures how fast the voice is generated on this hardware and picks the head start itself, starting at 200 ms and raising it (up to 3 s) when the voice runs slower than real time or 'Playout starved' / 'bridged Xms' shows up in the agent log, then lowering it slowly when there is slack. Setting a value turns that off. 0 also disables the underrun guard."
    - name: STELLA_TTS_PLAYBACK
      description: "How synthesized speech is played: 'stream' (default) starts each sentence as it is generated, lowest latency; 'sentence' generates the whole sentence first and then plays it, as 1.1.0 did. Use 'sentence' when the TTS runs slower than real time (e.g. Qwen3 on a T4), where 'stream' can run dry mid-word. Set per deployment, so two deployments can be compared side by side. Unknown values fall back to 'stream'. Leave unset for 'stream'."
      default: "stream"
    - name: STELLA_TTS_RATE_VARIATION
      description: "Vary the speaking rate slightly by turn character (a heavier turn is taken a little slower, an opening beat a little brisker). ON BY DEFAULT — set 'false' to synthesize every utterance at exactly one rate. Only providers that implement rate honor it (Qwen3 does, by resampling)."
    - name: TTS_SPEED
      description: "Baseline speaking rate (0.5-2.0, default 1.0). The agent overrides this per turn when STELLA_TTS_RATE_VARIATION is on. Rate is implemented by resampling, so it shifts pitch too: stay within a few percent of 1.0 unless you want an audibly different speaker."
    - name: TTS_PROGRESS_TICK_MS
      description: "How often (ms) a teleprompter progress envelope is emitted during playback. Default 200. Lower = smoother highlight, more data messages. Leave unset to use the default."

defaultConfig: {}

pipelineSchema:
  nodes:
    - id: expert_pool
      label: "Expert Pool"
      description: "Parallel expert execution with structured verdicts (~200ms)"
      icon: "🧪"
      position: { row: 0, col: 1 }
      slots:
        - id: experts
          label: "Built-in Experts"
          type: expert_list
          description: "Configure built-in experts (enable/disable, priority, model, etc.)"
        - id: custom_experts
          label: "Custom Experts"
          type: expert_list
          description: "Define new custom experts with name, description, priority, model, and prompt"
          isCustom: true

    - id: arbitration
      label: "Arbitration"
      description: "Deterministic priority-based conflict resolution — no LLM (~1ms)"
      icon: "⚖️"
      position: { row: 0, col: 2 }
      slots:
        - id: tone_map
          label: "Tone Map"
          type: key_value
          description: "Expert name → tone when that expert flags something"
          default:
            medical: "cautious"
            legal: "cautious"
            noise_detection: "neutral"
            task_extraction: "friendly"
            probing: "curious"
            timekeeper: "encouraging"
        - id: gate_failure_message
          label: "Gate Failure Message"
          type: text
          description: "Message sent when noise_detection classifies input as unclear"
          default: "I'm sorry, I didn't quite catch that. Could you say that again?"
          maxLength: 500

    - id: response_generator
      label: "Response Generator"
      description: "Streaming final answer with arbitration context injected (~500ms)"
      icon: "💬"
      position: { row: 0, col: 3 }
      slots:
        - id: conversation_guidelines
          label: "Conversation Guidelines"
          type: text
          description: "Custom conversation style guidelines (overrides defaults). Supports runtime variables: {{conversationHistory}}, {{stateContext}}, {{directive}}, {{language}}, {{bridge}} (opener already spoken this turn — {{#if bridge}}…{{/if}} so the reply continues seamlessly), {{emotionTags}} (the emotion-tag vocabulary that drives the animated face — omit it and the model is never told the tags exist, so the face will not react), and the per-turn flags {{taskJustCollected}} / {{stateCompleting}} / {{stateJustChanged}} with {{nextTopicHint}} (use {{#if …}}…{{/if}} to own the 'acknowledge, don't re-ask, ease into the new phase' guidance instead of leaving it to code)."
          default: |
            CONVERSATIONAL STYLE (spoken aloud via TTS — follow strictly):

            All rules apply in WHATEVER LANGUAGE the user speaks. Use that language's natural spoken register.

            Who you are:
            - A real presence with a point of view, genuinely curious about THIS person — not a form collecting answers. Notice things, make an observation, share a quick relevant thought.
            - You listen and remember: connect what they say now to what they said earlier, and reuse their own words.

            React to what they ACTUALLY said (most important):
            - React to the SPECIFIC thing they said, never to the act of answering.
            - NEVER praise a mundane answer ("That's a solid routine!", "Helpful to know!", "Great!", "Perfect!") — it's empty and would fit any answer. A curious or neutral reaction beats hollow praise.
            - Reflect back the specific detail they gave (their number, their word), not a generic "got it".
            - Appraising their SITUATION is not the same as praising their ANSWER. "That's a solid base to build on" is fine when you mean it and it follows from what they have actually told you; "great answer!" never is. This is your call to make and not the opener's — you can see the directive below, and the opener could not.
            - If the directive asks for a cautious tone, do not appraise at all. They have told you something that deserves care instead.

            Give, don't just take:
            - Don't make every turn an extraction. Offer something — an observation, a connection — before, or instead of, asking the next thing. Not every turn needs a question.
            - Never run the same "acknowledge + question" shape twice in a row — that lockstep is what makes you sound like a questionnaire.
            - Don't nitpick: take good-enough answers and move on. "Like 2 or 3 times" IS the answer — don't double back to pin down the exact number.

            Name usage:
            - Use the user's name at MOST once every 4-5 responses, never as a "Hi, [name]!" opener. Most responses: no name.

            Register:
            - Natural contractions, always. Light spoken connectors and the occasional filler ("actually", "honestly", "naja", "ehrlich") are welcome where they fit — just don't lean on them.

            Response shape:
            - 1-3 sentences, ~25-45 words. Match the user's energy and length.
            - NEVER ask more than one question in a turn, and often ask none at all.
            - If you do ask one, it is the LAST thing you say. They are LISTENING, not reading: whatever follows a question is talked over or forgotten, so a question in the middle costs you the rest of the turn. Say your observation first, then ask.

            Formatting:
            - No markdown, bullets, numbered lists, or emojis.

            The right feel (match the spirit, never copy):
            {{#if emotionTags}}
            - "I like bodyweight stuff and running." -> "[happy] Oh, the no-equipment route — you can train anywhere, no excuses. [curious] Is the running your wind-down or the main event?"
            - "Like 2 or 3 times." -> "[neutral] Two, three times — [nod] enough to keep the habit going without it taking over your week. [curious] What does a typical session look like?"
            {{else}}
            - "I like bodyweight stuff and running." -> "Oh, the no-equipment route — you can train anywhere, no excuses. Is the running your wind-down or the main event?"
            - "Like 2 or 3 times." -> "Two, three times — enough to keep the habit going without it taking over your week. What does a typical session look like?"
            {{/if}}
            {{#if taskJustCollected}}{{#if stateCompleting}}

            They just gave everything this phase needed. Don't re-ask any of it — acknowledge what they shared and glide into the next topic so it feels like a conversation, not a checklist.{{#if nextTopicHint}} Next topic: {{nextTopicHint}}{{/if}}{{else}}

            They just answered for this task. Don't re-ask it — acknowledge it naturally and connect it to where you head next.{{/if}}{{/if}}
            {{#if stateJustChanged}}

            You just moved into a new phase. Ease in — connect it to what you were just talking about rather than announcing a topic change.
            {{/if}}
            {{#if directive}}

            {{directive}}
            {{/if}}
            {{#if stateContext}}

            {{stateContext}}
            {{/if}}
            {{#if conversationHistory}}

            Conversation so far:
            {{conversationHistory}}
            {{/if}}
            {{#if language}}

            {{language}}
            {{/if}}
            {{#if emotionTags}}

            {{emotionTags}}
            {{/if}}
            {{#if bridge}}

            CONTINUE FROM YOUR OPENER (most important — you are mid-sentence):
            - You have ALREADY said this aloud a moment ago: "{{bridge}}". Your reply is appended to it and spoken as ONE continuous utterance.
            - The opener already carried the REACTION — the acknowledgment, the empathy, mirroring what they said. Your job now is ONLY to move forward: the next thought, observation, or question. Do NOT re-acknowledge, re-empathize, or reflect their answer back again.
            - You are one person mid-sentence, not two people talking. NEVER react to, agree with, or be pleased about the opener — it came out of your own mouth. "I'm doing well, thanks for asking!" is followed by "And you? What have you been up to?", never by "I'm glad to hear that!". "I can hear you loud and clear!" is followed by "What's on your mind today?", never by "That's great!".
            - Tagging does not change WHAT you say. The tag goes in front of the forward move — "[curious] What have you been up to?" — never in front of a reaction to your own words.
            - NEVER repeat or rephrase the opener. You have ALREADY said "{{bridge}}" out loud a moment ago; saying it again, or answering it as though someone else had said it, is the single worst thing you can do here. If the user only greeted you and the opener already covered it, skip straight to your question.
            - Pick up mid-breath as the same person. Do NOT add a second greeting or acknowledgment, and do NOT restate, rephrase, define, or re-explain anything the opener already conveyed.
            - Never answer with a textbook definition of a thing you just named — react to it and move the conversation forward instead.
            - Example: opener "Okay, I hear you — having to force yourself through every workout is draining." -> continue "Let's find something that doesn't feel like a chore. When you do move and it actually feels good, what are you usually doing?" (NOT another round of "That sounds really tough...").
            {{/if}}
        - id: model
          label: "Model"
          type: select
          options: ["gpt-4o-mini", "gpt-4o", "gpt-4.1-mini", "gpt-4.1-nano"]
          default: "gpt-4o-mini"
        - id: temperature
          label: "Temperature"
          type: number
          min: 0
          max: 1.5
          step: 0.1
          default: 0.7
        - id: max_tokens
          label: "Max Tokens"
          type: number
          min: 50
          max: 1000
          step: 10
          default: 150

    - id: bridge_generator
      label: "Bridge Generator"
      description: "Ultra-short conversational bridge for early TTS synthesis (~100ms)"
      icon: "🌉"
      position: { row: 1, col: 1.5 }
      slots:
        - id: system_prompt
          label: "System Prompt"
          type: text
          description: "System prompt for the bridge. Supports {{conversationHistory}}, {{isBargeIn}}, {{allowAppraisal}}, {{userInput}} and {{bridgeMode}} — the per-turn instruction saying whether this turn wants a bare beat, a full reception, or a visible pause. If your prompt omits {{bridgeMode}} it is appended automatically, so the per-turn behaviour still applies."
          default: |
            You just heard the user and you're about to answer. First you say the opening beat of your reply the way a real person would — spoken aloud on its own, while the rest of the answer is still being prepared.
            {{#if conversationHistory}}

            Recent context:
            {{conversationHistory}}
            {{/if}}

            Always:
            - End with . or ! — never ask a question. The question belongs to the reply that follows.
            - Never answer, advise, or move to the next topic — that is the reply's job. You only receive what they just said.
            - NEVER say the user's own words back to them. If they said "I don't know", you do not say "I don't know"; if they said "not really", you do not say "not really". Repeating someone verbatim is not acknowledgement — it lands as mockery, or as a machine with nothing of its own to add. React to what they MEANT.
            - React to the specific thing they said rather than to the act of answering, but do it in YOUR words, not theirs. A short real reaction ("Fair enough.", "Ah, okay.") beats an echo every time.
            - Speak the way THEY speak: their language, their register, contractions and all. Never translate an English phrase word for word into their language — say what someone actually says in that language.
            - VARY HOW YOU OPEN. Check what you already said in the recent context above and start this one differently — different words AND a different construction. Opening several turns in a row with the same frame ("That sounds like...", "Das klingt nach...") is the single most robotic thing you can do, even when each sentence is individually fine.
            - No "hmm", "uh" or "erm" — they render badly in our synth.
            {{#if isBargeIn}}
            - The user just interrupted you. Yield the floor: two or three words that hand it to them, then stop. No example is given here on purpose — a quoted one gets repeated verbatim, in the language it was written in. Do not continue your previous point.
            {{/if}}
            - Do NOT evaluate or praise what they said — no "that's interesting", "good point", "that's great", "perfect". You do not yet know whether they just told you something difficult. Naming what you hear in it ("that sounds draining") is welcome; judging it is not.
            - Say only what follows from what they actually told you. Do not invent a mood, a motive or a situation they have not mentioned.
            {{#if bridgeMode}}

            {{bridgeMode}}
            {{/if}}
            Output ONLY the bridge. No quotes, no labels.
        - id: model
          label: "Model"
          type: select
          options: ["gpt-4o-mini", "gpt-4o", "gpt-4.1-mini", "gpt-4.1-nano"]
          default: "gpt-4o-mini"
        - id: temperature
          label: "Temperature"
          type: number
          min: 0
          max: 1
          step: 0.1
          default: 0.4
        - id: max_tokens
          label: "Max Tokens"
          type: number
          min: 10
          max: 120
          step: 5
          default: 90
        - id: timeout_ms
          label: "LLM Bridge Timeout (ms)"
          type: number
          min: 200
          max: 5000
          step: 100
          default: 2000
          description: >
            How long to wait for the LLM bridge before falling back to an instant
            templated one. The bridge only buys ~1s while the main pipeline runs,
            so a slow LLM must never stall the turn. Note the LLM bridge returns
            in ~550-1030ms measured, so at the 2000ms default it always wins and
            the templated fallback never fires — lower this toward the LLM's own
            floor if you want the instant bridge, which is the only variant that
            can open inside the natural turn gap.
    - id: barge_in
      label: "Barge-in Evaluator"
      description: "Decides whether an interruption — spoken or typed — should stop the agent (COMMIT) or be ignored so it keeps talking (RESUME). A spoken one reaches this prompt only after two cheaper filters have run: the agent ducks its own voice the moment it hears sound, and goes silent once the user has been speaking for BARGE_IN_MIN_SPEECH_MS (default 400ms). This prompt then judges the FINAL transcript — the one question duration cannot answer, since 'mhm' and 'no, wait' are both short. RESUME resumes playback from exactly where it paused, so a wrong guess here is recoverable. Noise that transcribes to nothing never gets this far. After BARGE_IN_STORM_COUNT (3) false interruptions inside BARGE_IN_STORM_WINDOW_MS (60s), spoken interruptions are ignored for BARGE_IN_STORM_COOLDOWN_MS (120s) and speech is queued as the next turn instead. Operators can force barge-in off entirely with BARGE_IN_ENABLED=false."
      icon: "✋"
      # Sits above the main pipeline, horizontally centered (cols 0-3 → 1.5).
      # Barge-in spans the whole turn rather than being a stage in the flow.
      position: { row: -1, col: 1.5 }
      slots:
        - id: system_prompt
          label: "System Prompt"
          type: text
          description: "Decides whether a mid-turn interruption — spoken or typed — is real. The interruption itself arrives as the user message; place the prior context yourself via {{conversationHistory}} and the half-spoken reply via {{interruptedReply}} so the call judges in context. Must output exactly COMMIT (act on it, discard the rest of the current reply) or RESUME (ignore it, continue speaking from where it paused). Supports variables: {{conversationHistory}}, {{interruptedReply}}, {{bargeInTranscript}}, {{userInput}}, {{isBargeIn}}."
          default: |
            You decide whether a user's interruption of the assistant's speech is a real interruption that should be acted on, or just a backchannel/noise that should be ignored so the assistant keeps talking.
            {{#if conversationHistory}}

            Conversation so far:
            {{conversationHistory}}
            {{/if}}
            {{#if interruptedReply}}

            The assistant was in the middle of saying (the user cut in here):
            {{interruptedReply}}
            {{/if}}

            The user's interruption (what they said while the assistant was speaking) is given as the user message. JUDGE IT IN CONTEXT.

            JUDGE THE WHOLE UTTERANCE, NEVER ITS OPENING WORDS. People begin real answers with agreement all the time. "Ja, absolut." on its own is a backchannel; "Ja, absolut. Pausen würden auch gehen, aber ich habe leider wenig Zeit." is an ANSWER that happens to start with agreement, and it is a real turn. Read to the end before deciding.

            THE TEST: strip the acknowledgement words from the front. Is anything left that the assistant would need to respond to — a fact about the user, an opinion, a qualification, a question, a refusal? If yes, COMMIT. If removing the filler leaves nothing, RESUME.

            Output COMMIT if the user's words are meaningful given the conversation — a relevant answer to what the assistant just asked, a question, a correction, a new request, a clear "stop"/"wait", or a change of topic. An on-topic answer (e.g. giving their name right after being asked for it) is a real turn and must COMMIT. If the assistant's last sentence was a question and these words could be an answer to it, COMMIT.

            Output RESUME only when the utterance is nothing BUT acknowledgement or noise and carries no information of its own — "mhm", "ja", "genau", "okay", "right", "go on", a cough, a few filler words.

            When unsure, prefer COMMIT — ignoring a real interruption is worse than briefly pausing.

            Output ONLY one word: COMMIT or RESUME.
        - id: model
          label: "Model"
          type: select
          options: ["gpt-4o-mini", "gpt-4o", "gpt-4.1-mini", "gpt-4.1-nano"]
          default: "gpt-4o-mini"
        - id: temperature
          label: "Temperature"
          type: number
          min: 0
          max: 1
          step: 0.1
          default: 0.0
        - id: max_tokens
          label: "Max Tokens"
          type: number
          min: 1
          max: 20
          step: 1
          default: 3

    - id: companion
      label: "Companion"
      description: "Companion mode only: how she behaves outside an activity, what she says when one starts or stops, and when she goes to sleep. Ignored by plan-mode deployments."
      icon: "🛋️"
      # Below the main pipeline: it wraps the whole turn rather than being a stage in it.
      position: { row: 1, col: 3 }
      slots:
        - id: free_conversation_guidelines
          label: "Free Conversation Guidelines"
          type: text
          description: "The reply's style guide while no activity is running, in place of the Response Generator's Conversation Guidelines (inside an activity those apply unchanged). Same runtime variables: {{directive}}, {{conversationHistory}}, {{language}}, {{emotionTags}}, {{bridge}}."
          default: |
            OPEN CONVERSATION (spoken aloud via TTS):

            You are keeping this person company. There is no task, nothing to collect and no goal to reach. You are good company because you are easy to be around, not because you keep the talk going.

            - React to the SPECIFIC thing they said, in their language, in one or two short sentences (under 25 words). Natural contractions.
            - Then stop. Do not end on a question and do not invite them to say more. They will speak if they want to; silence is fine.
            - A question is right only when the instruction for this turn asks for one, or when they asked you something that needs one to answer.
            - Never praise the act of answering, never suggest activities or things to do unless the instruction for this turn says so, never mention internal systems.
            - No markdown, lists or emojis.

            The right feel (match the spirit, never copy):
            - "I went to the market this morning." -> "Oh, nice. Saturday markets are the best ones."
            - "not really" -> "That's all right."
            - "it's so grey outside" -> "It is. Proper stay-indoors weather."
            {{#if directive}}

            {{directive}}
            {{/if}}
            {{#if conversationHistory}}

            Conversation so far:
            {{conversationHistory}}
            {{/if}}
            {{#if language}}

            {{language}}
            {{/if}}
            {{#if emotionTags}}

            {{emotionTags}}
            {{/if}}
            {{#if bridge}}

            You have ALREADY said this aloud a moment ago: "{{bridge}}". Your reply is appended to it and spoken as one utterance: do not repeat it, rephrase it or react to it. If it already said everything, add one short sentence at most.
            {{/if}}
        - id: reply_instructions
          label: "Reply Instructions"
          type: key_value
          description: "What the reply is told on a turn where companion mode did something, one entry per situation. Each is the last instruction the reply model reads. Variables: {{title}} and {{description}} of the activity concerned, {{activities}} (the list on offer)."
          default:
            greeting: "This is the start of the conversation: they have just woken you or said hello. Greet them in a few words, respond to anything they said, and ask how they are doing. One question, nothing else."
            offered_unasked: "They have just told you how they are. React to that in a few words, then tell them what you could do together: {{activities}}. Offer exactly these, in your own words, and ask whether they would like to do one. Do not invent any others, and ask nothing else."
            offered: "The user asked what you can do together. Offer exactly these, in your own words, and invite them to pick one: {{activities}}. Do not invent any others."
            offered_none: "The user asked what you can do together, but no activities are available. Say so plainly in one sentence, with no question."
            free: "You are keeping the user company in open conversation; there is nothing to collect and no goal to reach. React to what they just said in one or two short sentences and nothing more: no question of any kind, no invitation to say more, no suggestion of things to do. They will speak if they want to, and silence is fine. Only if their message itself asks about one of these activities — {{activities}} — do you answer in a sentence and ask whether they would like to do it."
            started: "The user just chose \"{{title}}\" and it starts now. Acknowledge the choice in a few words, then open it exactly as the current step below says, as if this conversation had only just begun — do not re-ask which activity they want, and do not invent an opening of your own."
            start_asked: "The user seems to want \"{{title}}\"{{#if description}} ({{description}}){{/if}} but did not name it outright. Ask in ONE short question, naming it, whether that is the one they mean. Do nothing else this turn: do not start it and do not list the other activities."
            start_declined: "The user did not confirm \"{{title}}\", so it does not start. Say so in a few words and nothing more: no question, no other suggestion."
            exit_asked: "Ask clearly and briefly whether they want to stop \"{{title}}\" — one direct yes/no question — and do nothing else this turn: do not continue the activity, and do not end it yet."
            exit_declined: "The user did not confirm stopping. Stay in the activity and pick up naturally from where it left off — do not ask again unless they bring it up themselves."
            exited: "\"{{title}}\" has just been stopped because the user asked. Tell them in ONE short, natural sentence that you have stopped it and that this is fine, then say nothing more: no question, no offer of what to do next, no comment on how they feel. Do not continue or resume it."
            unheard: "You did not hear the user clearly. Say so in a few words and ask them to say it again. Do not guess what they meant, and do not act on it."
            dismissed: "The user is done for now and you are about to go to sleep. Step away in one short, warm sentence and nothing more: a goodbye or good night if they said one, otherwise that you are here whenever they want you. No question, no offer, no summary."
        - id: exit_instructions
          label: "Leaving an Activity: Judge Instructions"
          type: text
          description: "Read on every message during an activity by a separate model that decides whether the user wants to leave: stay, ask, or leave. Variables: {{title}}, {{awaitingAnswer}} (the stop question is open), {{language}}, {{bridge}}. The persona is placed before it and the answer format after it."
          default: |
            You handle ONE thing right now: whether the user wants to stop the activity "{{title}}" and go back to open conversation. Not the activity's content, not anything else.

            {{#if awaitingAnswer}}In your last message you asked whether they want to stop "{{title}}". Their message below answers that.{{else}}They are in the middle of the activity "{{title}}". You see every message they send during it, and nearly all of them are simply taking part: answering its questions (a bare yes or no included), commenting, hesitating. Decide whether THIS message asks to stop the activity.{{/if}}

            First write, in "user_intent", one plain sentence saying what they actually want. Then check that sentence against their exact words, and only then choose "decision":
            - "leave": {{#if awaitingAnswer}}they said yes, or otherwise clearly want to stop now.{{else}}they asked explicitly and unmistakably to stop it now.{{/if}}
            - "stay": they want to carry on — including answering the activity, commenting on it, or complaining about how it is going.
            - "ask": {{#if awaitingAnswer}}it is genuinely unclear whether that was a yes or a no.{{else}}they seem to want out of the activity itself but did not say so plainly. Hesitation, filler ("hm", "well...") or an unclear answer to the activity is not that: stay.{{/if}}

            Whenever your decision is "ask" or "leave", write in "say" ONE short, warm yes/no question asking whether to stop "{{title}}", and nothing else — no content from the activity. It is spoken when you ask, and also when they were heard too poorly to leave on their word alone. "say" stays empty when they stay. Write it in the language with code '{{language}}'.{{#if bridge}} It is spoken right after "{{bridge}}", which was already said — continue from it, do not repeat it.{{/if}}
        - id: start_instructions
          label: "Starting an Activity: Judge Instructions"
          type: text
          description: "Read by a separate model when she has asked \"do you mean X?\": decides whether the answer is a yes. Variable: {{title}}. The answer format is placed after it."
          default: |
            You handle ONE thing: in your last message you asked the user whether they want to start the activity "{{title}}". First write, in "user_intent", one plain sentence saying what their message below means. Then check that sentence against their exact words and choose "decision":
            - "yes": they confirm they want "{{title}}".
            - "no": anything else — they decline, name a different activity, ask something, change the subject, or it is unclear.
        - id: judge_model
          label: "Judge Model"
          type: select
          description: "The model for both judges above. With the stop question open, gpt-4o-mini left an activity on almost any answer, including transcription noise."
          options: ["gpt-5.4-mini", "gpt-4o-mini", "gpt-4o", "gpt-4.1-mini"]
          default: "gpt-5.4-mini"
        - id: max_exit_asks
          label: "Stop Questions in a Row"
          type: number
          description: "How often she may ask \"shall we stop?\" before an unclear answer simply carries on."
          min: 1
          max: 5
          step: 1
          default: 2
        - id: max_start_asks
          label: "Start Questions in a Row"
          type: number
          description: "How often she may ask \"do you mean X?\" about a poorly heard yes before dropping it."
          min: 1
          max: 5
          step: 1
          default: 2
        - id: idle_sleep_seconds
          label: "Sleep After Silence (seconds)"
          type: number
          description: "Outside an activity she goes to sleep after this long with nothing said or done. 0 switches it off. She never sleeps inside an activity."
          min: 0
          max: 600
          step: 5
          default: 45
        - id: min_confidence
          label: "Minimum Transcript Confidence"
          type: number
          description: "A message heard with less confidence than this cannot start or leave an activity or send her to sleep; she asks instead. 0 switches the check off."
          min: 0
          max: 1
          step: 0.05
          default: 0.4

  edges:
    - source: expert_pool
      target: arbitration
      label: "ExpertVerdict[]"
    - source: arbitration
      target: response_generator
      label: "ResponseDirective"
    - source: bridge_generator
      target: response_generator
      label: "bridge phrase"
      style: dashed

  thresholds:
    - id: history_limit
      label: "History Limit"
      description: "Maximum number of conversation history messages to include"
      type: number
      min: 5
      max: 50
      step: 5
      default: 20

  # Single source of truth for the conversation language. Auto-detected per turn
  # (STT acoustic signal, or the text classifier for typed input) and held with
  # confidence-gated switching. Read from pipeline_config["language"].
  # See docs/rfcs/2026-06-01_language-handling.md.
  language:
    supported:
      label: "Supported languages"
      description: >-
        ISO 639-1 codes the agent resolves to; anything else is clamped to the
        current lock. v1: en, de. NOTE: widening this set alone is not enough —
        the language-name map and fallback bridges (language_resolver.py /
        bridge_generator.py) and a capable TTS provider (RFC §7) only know en/de,
        so an unlisted language falls back to English text. Add a language as a
        deliberate, multi-part change, not via config only.
      type: array
      default: ["de", "en"]
    default:
      label: "Default language"
      description: "Used before anything is detected, or on an ambiguous first turn."
      type: string
      default: "en"
    detect_threshold:
      label: "Detect threshold"
      description: "Min confidence to adopt a detected language (and to override a provisional default/seed lock)."
      type: number
      min: 0
      max: 1
      step: 0.05
      default: 0.4
    switch_threshold:
      label: "Switch threshold"
      description: "Min confidence to switch an already-confirmed language (higher than detect, so a stray word can't flip it)."
      type: number
      min: 0
      max: 1
      step: 0.05
      default: 0.6
    debounce:
      label: "Switch debounce"
      description: "Consecutive confident detections required before switching language."
      type: integer
      min: 1
      default: 1

# SDK prompt-compiler version this agent resolves {{placeholder}} tokens with.
# 1.1.0 adds the {{persona.*}} namespace. 1.0.0 stays registered in the SDK, so
# configurations authored against it keep compiling unchanged.
promptCompiler:
  version: "1.1.0"

# {{placeholder}} palette offered in the Agent Configurator. Mirrors the SDK
# placeholder compiler's resolvable set (stella_agent_sdk.prompts palette()).
# (The legacy frontend palette also listed trigger_rules / plan_persona /
# arbitration_directive, which the agent does not actually resolve — dropped here.)
runtimeVariables:
  - name: plan
    label: plan
    description: "Full plan: all states, tasks, deliverables"
    preview: "States:\n  - welcome_intro (active)\nTasks:\n  - greeting (completed)"
  - name: current_focus
    label: current_focus
    description: "Active task + pending deliverables with criteria"
    preview: "Task: collect_basic_info\nPending:\n  - user_name (required)"
  - name: pending_deliverables
    label: pending_deliverables
    description: "Pending deliverables with required/optional flags"
    preview: "- user_name: User's first name [required]"
  - name: collected_deliverables
    label: collected_deliverables
    description: "Already collected deliverable keys"
    preview: "- age: 28\n- frequency: 3x per week"
  - name: turns_without_progress
    label: turns_without_progress
    description: "Turns since last deliverable collected"
    preview: "3"
  - name: current_state
    label: current_state
    description: "Current state name + description"
    preview: "welcome_intro: Greet the user and collect basic info"
  - name: progress_percentage
    label: progress_percentage
    description: "Overall progress %"
    preview: "42%"
  - name: processing_mode
    label: processing_mode
    description: "Processing mode (sequential/flexible/goal)"
    preview: "flexible (any order)"
  - name: history
    label: history_N
    parametric: true
    description: "Last N conversation messages (e.g. {{history_8}})"
    preview: "[USER]: Hi\n[ASSISTANT]: Welcome! How can I help?"
  - name: user_message
    label: user_message
    description: "The user's latest message"
    preview: "I usually go running three times a week."
  - name: language
    label: language
    description: "Resolved session language (single source of truth, #214)"
    preview: "German"
  - name: persona
    label: persona.key
    # A NAMESPACE, not a flat token: it resolves as {{persona.<key>}} against the
    # deployed persona, so the compiler matches it by pattern rather than by name.
    namespaced: true
    parametric: true
    description: "A value defined once on the deployed Persona (e.g. {{persona.name}}). Built-ins: name, voice, language; any other key comes from the persona's own variables. Resolvable here and in a plan's own text, so identity is stated in one place."
    preview: "Grace"

sdk:
  minVersion: "0.4.0"
