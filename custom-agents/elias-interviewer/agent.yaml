version: "2.0"

metadata:
  name: "ELIAS-Interviewer"
  slug: "elias-interviewer"
  version: "0.2.1"
  description: "Runs an ELIAS interview guide: asks every question word for word, re-asks unclear answers up to three times, and writes each turn back to ELIAS as it happens."
  icon: "🎙️"
  author:
    name: "STELLA Team"
  tags:
    - interview
    - research
    - elias

capabilities:
  - voice
  - text
  - progress

image:
  dockerfile: "Dockerfile"

resources:
  memory:
    request: "256Mi"
    limit: "512Mi"
  cpu:
    request: "100m"
    limit: "500m"

# It asks the guide word for word, so it takes no persona and no plan; it
# builds its own state-machine plan from the guide.
features:
  persona: false

# Everything a deployment sets is an env var. The questions themselves always
# come from ELIAS, word for word.
env:
  required:
    - OPENAI_API_KEY
    - ELIAS_PROJECT_ID
  optional:
    - name: ELIAS_MAX_ATTEMPTS
      description: "How many times a question is asked in total before it is skipped (1-5)."
      default: "3"
    - name: ELIAS_OPENING
      description: "What the agent says before the first question."
    - name: ELIAS_REASK_PREFIX
      description: "What the agent says before asking a question again."
    - name: ELIAS_CLOSING
      description: "What the agent says after the last question."
    - name: ELIAS_ERROR
      description: "What the agent says when the interview cannot start."
    - name: ANSWER_CHECK_MODEL
      description: "Model that checks whether a reply answers the question."
      default: "gpt-4o-mini"
    - name: ANSWER_CHECK_TIMEOUT_S
      description: "Seconds the answer check may take before the reply is accepted as is (1-60)."
      default: "8"
    - name: STELLA_LANGUAGE
      description: "Pin speech recognition and the voice to one language (ISO 639-1, e.g. 'de'). Set it to the language of the guide."

# The ELIAS server. The user binds one of their own connectors (or one shared
# with the project) to this slot at deploy; the agent calls it as "elias".
connectors:
  - slot: elias
    kind: mcp
    required: true
    label: "ELIAS"
    description: "ELIAS interview-questions server (https://elias.apps.c4dhi.org/mcp)"
    requiredTools:
      - get_interview_guide
      - start_interview
      - record_interview_message
      - end_interview
