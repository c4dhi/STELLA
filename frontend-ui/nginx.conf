server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Serve runtime config (must be before SPA routing)
    location = /config.js {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The SVG favicon. nginx already sends image/svg+xml; adding Content-Type here
    # sent the header twice.
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400";
    }

    # The rest of the icon set (#133). Same names on every release, so a day's
    # cache rather than the immutable year the hashed assets below get.
    location ~ ^/(favicon\.ico|apple-touch-icon\.png|icon-(192|512)\.png)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # SPA routing: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
